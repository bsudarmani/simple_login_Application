<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
        <link rel="stylesheet" href="style.css">
</head>
<body style="background-color: #dbedff;">
    <div class="row">
        <div class="col-6">
            <img src="signin.jpg" width="600" height="600">
        </div>
        <div class="col-3" style="margin-top: 150px;">
            <h1 class="h3 text-center">Sign In your account</h1>
            <form id="LoginForm">
                <label style="font-weight: bold;">Email</label>
                <input class="form-control mt-2" placeholder="Enter the Email address" id="email">
                 <p class="text-red" id="ErrorEmail"></p>

                <label style="font-weight: bold;">Password</label>
                <input class="form-control mt-2" placeholder="Enter the Password" id="pass">
                <p class="text-red" id="ErrorPass"></p>

                <button class="btn i-color mt-4 i-btn " style="margin-left: 130px;">Sign In</button>
                <p id="message"></p>
            </form>

        </div>
    </div>
</body>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.min.js"

    crossorigin="anonymous"></script>
</html>
