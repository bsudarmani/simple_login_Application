<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="row">
        <div class="col-6 m-5">
            <img src="signin1.jpg" alt="signin" width="700" height="600">
        </div>
        <div class="col-3">
            <form class="mt-5" id="SignUpForm">


                <label style="font-weight: bold;">First Name</label>
                <input type="text" class="form-control mt-2" placeholder="Enter the first Name" id="fname" required>
                 <p class="text-red" id="ErrorFName"></p>

                <label style="font-weight: bold;">Last Name</label>
                <input type="text" class="form-control mt-2" placeholder="Enter the last Name" id="lname">
                <p class="text-red" id="ErrorLName"></p>

                <label style="font-weight: bold;">Email</label>
                <input type="email" class="form-control mt-2" placeholder="Enter the Email address" id="email" required>
                <p class="text-red" id="ErrorEmail"></p>
                
                <div class="password-box">
                <label style="font-weight: bold;">Password</label>
                <input  type="password"  class="form-control mt-2" placeholder="Enter the Password" id="password" required>
                <p class="text-red" id="ErrorPass"></p>
                </div>

                <label style="font-weight: bold;">Confirm Password</label>
                <input type="password" class="form-control mt-2" placeholder="Enter the Confirm Password" id="cpassword">
                <p class="text-red" id="ErrorCPass"></p>

                <label style="font-weight: bold;">Contact Number</label>
                <input type="tel"  class="form-control mt-2" placeholder="Enter the Contact Number" id="contactnumber" maxlength="10" inputmode="numeric">
                <p class="text-red" id="ErrorCNum"></p>

                <label style="font-weight: bold;">Organizarion Name</label>
                <input class="form-control mt-2" placeholder="Enter the Organizarion Name" id="orgname">
                <p class="text-red" id="ErrorOrgName"></p>

                <label style="font-weight: bold;">Organizarion Description</label>
                <input class="form-control mt-2" placeholder="Enter the Organizarion Description" id="orgdes">
                <p class="text-red" id="ErrorOrgDes"></p>

                <!-- <label style="font-weight: bold;">Organizarion URL</label>
                <input class="form-control mt-2" placeholder="Enter the Organizarion URL" id="orgurl">
                <p class="text-red" id="ErrorOrgURL"></p> -->

                <label style="font-weight: bold;">Organizarion Mail</label>
                <input class="form-control mt-2" placeholder="Enter the Organizarion Mail" id="orgmail">
                <p class="text-red" id="ErrorCEmail"></p>

                <div class="d-flex align-items-center justify-content-center mt-2">
                    <button type="submit" class="btn hr-btn mt-2  i-btn">SignUp</button><br>
                </div>
                <div class="d-flex align-items-center justify-content-center mt-2">
                    <h6 style="font-weight: bolder;" class=" mt-2">Already Have an account ?</h6>
                    <p id="message"></p>
                    <button type="button" class="btn hr-btn"><a class="i-a i-btn text-light" href="hr-login.html">SignIn</a></button>
                </div>
            </form>
        </div>
    </div>

</body>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM"
    crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.9.2/dist/umd/popper.min.js"
    integrity="sha384-IQsoLXl5PILFhosVNubq5LC7Qb9DXgDA9i+tQ8Zj3iwWAwPtgFTxbJ8NT4GN1R8p"
    crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.min.js"
    integrity="sha384-cVKIPhGWiC2Al4u+LWgxfKTRIcfu0JTxR+EQDz/bgldoEyl4H0zUF0QKbrJ0EcQF"
    crossorigin="anonymous"></script>
<script src="script.js"></script>
</html>
